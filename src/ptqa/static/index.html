<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portugal services QA</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6b66;
    --line: #e2e1dc;
    --accent: #0a6e4f;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --card: #1f1f1d;
      --text: #ecebe6;
      --muted: #9d9c95;
      --line: #34332f;
      --accent: #3fbf8f;
      --accent-text: #0d1f18;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  form, .result {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  textarea {
    width: 100%;
    min-height: 88px;
    resize: vertical;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .modes label { margin-right: 12px; white-space: nowrap; }
  button {
    margin-left: auto;
    padding: 8px 18px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .examples { margin: 16px 0 24px; display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button {
    margin: 0;
    padding: 6px 12px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    font-weight: 400;
    font-size: 0.9rem;
    text-align: left;
  }
  .result { display: none; }
  .answer p { margin: 0 0 8px; }
  .answer ul { margin: 0 0 8px; padding-left: 20px; }
  .answer a { color: var(--accent); text-decoration: none; font-size: 0.85em; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 20px 0 6px; }
  .sources a { color: var(--accent); word-break: break-word; }
  .sources li, .searches li { margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 0.9rem; margin-top: 16px; }
  .error { color: #c0392b; }
</style>
</head>
<body>
<main>
  <h1>Portugal services QA</h1>
  <p class="lead">Ask about residence permits, taxes and social security in Portugal, in Turkish,
    English or Portuguese. Answers come only from official pages and cite them.</p>

  <form id="form">
    <textarea id="question" placeholder="How do I get a NIF as a foreigner?" required></textarea>
    <div class="row">
      <span class="modes">
        <label><input type="radio" name="mode" value="rag" checked> RAG</label>
        <label><input type="radio" name="mode" value="agent"> Agent</label>
        <label><input type="radio" name="mode" value="multi"> Multi-agent</label>
      </span>
      <button id="submit" type="submit">Ask</button>
    </div>
  </form>

  <div class="examples">
    <button type="button" data-mode="rag">Araştırmacı oturma izni için hangi belgeler gerekiyor?</button>
    <button type="button" data-mode="agent">I am starting freelance work. How do I open activity and what do I pay to Social Security?</button>
    <button type="button" data-mode="multi">Vim com visto para procura de trabalho e já tenho contrato. O que tenho de tratar na AIMA, nas Finanças e na Segurança Social?</button>
  </div>

  <section class="result" id="result">
    <div class="answer" id="answer"></div>
    <h2>Sources</h2>
    <ol class="sources" id="sources"></ol>
    <div id="search-block">
      <h2>Searches</h2>
      <ul class="searches" id="searches"></ul>
    </div>
    <p class="meta" id="meta"></p>
  </section>
</main>

<script>
  const form = document.getElementById("form");
  const question = document.getElementById("question");
  const submit = document.getElementById("submit");
  const result = document.getElementById("result");

  function escape(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function inline(text, refs) {
    return escape(text)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[(\d+)\]/g, (m, n) => {
        const ref = refs[n];
        return ref ? `<a href="${escape(ref.url)}" title="${escape(ref.title)}" target="_blank" rel="noopener">[${n}]</a>` : m;
      });
  }

  function render(text, refs) {
    const html = [];
    let list = [];
    const flush = () => {
      if (list.length) html.push(`<ul>${list.join("")}</ul>`);
      list = [];
    };
    for (const line of text.split("\n")) {
      const item = line.match(/^\s*[-*]\s+(.*)/);
      if (item) {
        list.push(`<li>${inline(item[1], refs)}</li>`);
      } else {
        flush();
        if (line.trim()) html.push(`<p>${inline(line, refs)}</p>`);
      }
    }
    flush();
    return html.join("");
  }

  function fill(id, items) {
    const el = document.getElementById(id);
    el.replaceChildren(...items);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const mode = form.querySelector("input[name=mode]:checked").value;
    submit.disabled = true;
    submit.textContent = "Searching...";
    try {
      const resp = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question.value, mode }),
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      document.getElementById("answer").innerHTML = render(data.answer, data.references);
      fill("sources", data.sources.map((s) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = s.url;
        a.textContent = s.title;
        a.target = "_blank";
        a.rel = "noopener";
        li.append(a);
        return li;
      }));
      fill("searches", data.searches.map(([agency, query]) => {
        const li = document.createElement("li");
        li.textContent = `${agency}: ${query}`;
        return li;
      }));
      document.getElementById("search-block").style.display = data.searches.length ? "" : "none";
      document.getElementById("meta").textContent =
        `${mode}, ${data.llm_calls} LLM calls, ${data.seconds} s`;
    } catch (err) {
      document.getElementById("answer").innerHTML = `<p class="error">${escape(err.message)}</p>`;
      fill("sources", []);
      fill("searches", []);
      document.getElementById("meta").textContent = "";
    } finally {
      result.style.display = "block";
      submit.disabled = false;
      submit.textContent = "Ask";
    }
  });

  document.querySelectorAll(".examples button").forEach((b) => {
    b.addEventListener("click", () => {
      question.value = b.textContent;
      form.querySelector(`input[value=${b.dataset.mode}]`).checked = true;
      form.requestSubmit();
    });
  });
</script>
</body>
</html>
